{% extends "layout.html" %}

{% block content %}
<div class="row">
    <div class="col-lg-8 offset-lg-2 text-center">
        <h2 class="mb-4">
            {% if mode == 'single' %}
                <i class="fas fa-user text-primary"></i> 单人情绪实时监测
            {% else %}
                <i class="fas fa-user-friends text-info"></i> 双人互动监测
            {% endif %}
        </h2>
        
        <div class="video-container mb-4">
            <img src="{{ url_for('video_feed') }}" width="100%" class="img-fluid" alt="Camera Feed">
        </div>

        <div class="d-flex justify-content-center gap-3">
            <button id="startBtn" class="btn btn-primary btn-lg px-5">
                <i class="fas fa-play me-2"></i>开始采集数据
            </button>
            <button id="stopBtn" class="btn btn-danger btn-lg px-5" style="display: none;">
                <i class="fas fa-file-pdf me-2"></i>生成 PDF 报告
            </button>
            <a id="downloadBtn" href="#" class="btn btn-success btn-lg px-5" style="display: none;">
                <i class="fas fa-download me-2"></i>下载报告
            </a>
        </div>
        
        <div id="statusText" class="mt-3 text-muted">准备就绪，请点击开始采集...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $('#startBtn').click(function() {
        $.post('/api/start_recording', function(res) {
            $('#startBtn').hide();
            $('#stopBtn').show();
            $('#statusText').text('正在采集数据中... 请保持自然状态');
            $('#statusText').addClass('text-danger fw-bold');
        });
    });

    $('#stopBtn').click(function() {
        // 显示全屏 Loading
        $('#loadingOverlay').css('display', 'flex');
        
        $.post('/api/stop_and_generate', function(res) {
            $('#loadingOverlay').hide(); // 隐藏 Loading
            
            if (res.status === 'success') {
                $('#stopBtn').hide();
                $('#downloadBtn').attr('href', res.file_url).show();
                $('#statusText').text('报告生成完毕！').removeClass('text-danger').addClass('text-success');
            } else {
                alert('生成失败: ' + res.message);
            }
        }).fail(function() {
            $('#loadingOverlay').hide();
            alert('服务器错误，请检查后台日志');
        });
    });
</script>
{% endblock %}
