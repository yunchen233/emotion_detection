{% extends "layout.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4"><i class="fas fa-history text-secondary"></i> 历史记录</h2>
        
        <div class="card">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>时间</th>
                            <th>模式</th>
                            <th>文件名</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for record in records %}
                        <tr>
                            <td>{{ record.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                            <td>
                                <span class="badge rounded-pill 
                                    {% if 'Single' in record.mode %}bg-primary
                                    {% elif 'Double' in record.mode %}bg-info
                                    {% else %}bg-success{% endif %}">
                                    {{ record.mode }}
                                </span>
                            </td>
                            <td>{{ record.filename }}</td>
                            <td>
                                <a href="/static/results/{{ record.filename }}" class="btn btn-sm btn-outline-primary" download>
                                    <i class="fas fa-download"></i> 下载
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% if not records %}
                    <p class="text-center text-muted my-4">暂无历史记录</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
